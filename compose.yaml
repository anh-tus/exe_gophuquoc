services:
  public-web:
    build:
      context: .
      dockerfile: frontend/public-web/Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trip_trip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trip_trip"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: identity-service
    environment:
      PORT: "3101"
      IDENTITY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/trip_trip?schema=identity
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3101:3101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  supply-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: supply-service
    environment:
      PORT: "3102"
      SUPPLY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/trip_trip?schema=supply
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3102:3102"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: booking-service
    environment:
      PORT: "3103"
      BOOKING_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/trip_trip?schema=booking
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3103:3103"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3103/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
